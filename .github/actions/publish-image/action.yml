name: Publish built image
description: Publish built image

inputs:
  tags:
    description: List of tags to push and sign
    required: true
  cosign-key:
    description: Cosign private key
    required: true

runs:
  using: composite
  steps:
    - name: Login to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      if: github.event_name != 'pull_request'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Push image to GHCR
      uses: Wandalen/wretry.action@v3
      if: github.event_name != 'pull_request'
      id: push
      env:
        REGISTRY_USER: ${{ github.actor }}
        REGISTRY_PASSWORD: ${{ github.token }}
      with:
        action: redhat-actions/push-to-registry@v3.0.0
        attempt_limit: 3
        attempt_delay: 2000
        with: |
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ inputs.tags }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

    - name: Setup Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      if: github.event_name != 'pull_request'

    - name: Sign image
      if: github.event_name != 'pull_request'
      shell: bash
      run: |
        IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
        for tag in ${{ inputs.tags }}; do
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "$IMAGE_FULL:$tag"
        done
      env:
        COSIGN_EXPERIMENTAL: false
        COSIGN_PRIVATE_KEY: ${{ inputs.cosign-key }}
