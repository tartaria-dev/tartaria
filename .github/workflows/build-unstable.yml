---
name: Build Tartaria (unstable)
on:
  schedule:
    - cron: "05 10 * * *"
  pull_request:
    branches:
      - live
    paths-ignore:
      - "**/README.md"
      - "**/.devcontainer.json"
      - "**/cleanup.yml"
      - "**/dependabot.yml"
      - "**/renovate.json5"
      - "**/artifacthub-repo.yml"
      - "**/build-tartaria-stable.yml"
      - "**/build-iso.yml"
      - "**/iso-downloader.sh"
  push:
    tags-ignore:
      - 'v*'
    branches:
      - live
    paths-ignore:
      - "**/README.md"
      - "**/.devcontainer.json"
      - "**/cleanup.yml"
      - "**/dependabot.yml"
      - "**/renovate.json5"
      - "**/artifacthub-repo.yml"
      - "**/build-tartaria-stable.yml"
      - "**/build-iso.yml"
      - "**/iso-downloader.sh"
  workflow_dispatch:

env:
  IMAGE_DESC: "Arch Linux bootc image with some extra spices (unstable)"
  IMAGE_KEYWORDS: "bootc,archlinux,arch,niri"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/203742804?s=400&u=d24737bd121e7065274b95479507dabd0125b9ea&v=4"
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "unstable"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-unstable
  cancel-in-progress: true

jobs:
  build_push_sealed:
    name: Build Tartaria (sealed) (unstable-${{ matrix.IMAGE_FLAVOR }})
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - IMAGE_FLAVOR: arch-maraska
            containerfile: ./build_files/images/Containerfile.arch-sealed
          - IMAGE_FLAVOR: arch-saffron
            containerfile: ./build_files/images/Containerfile.arch-sealed
          - IMAGE_FLAVOR: cachy-maraska
            containerfile: ./build_files/images/Containerfile.cachy-sealed
          - IMAGE_FLAVOR: cachy-saffron
            containerfile: ./build_files/images/Containerfile.cachy-sealed

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Prepare build
        id: prep
        uses: ./.github/actions/prepare-image
        with:
          image-flavor: ${{ matrix.IMAGE_FLAVOR }}
          default-tag: ${{ env.DEFAULT_TAG }}

      - name: Build base image
        id: build_base
        uses: redhat-actions/buildah-build@v3.1.0
        env:
          MODULE_KEY: ${{ secrets.MODULE_KEY }}
          MODULE_CERT: ${{ secrets.MODULE_CERT }}
          SECUREBOOT_CERT: ${{ secrets.SECUREBOOT_CERT }}
        with:
          containerfiles: ${{ matrix.containerfile }}
          extra-args: |
            --target base
            --secret id=secureboot_cert,env=SECUREBOOT_CERT
            --secret id=module_key,env=MODULE_KEY
            --secret id=module_cert,env=MODULE_CERT
            --security-opt=label=disable
          image: stage-base
          tags: ${{ github.run_id }}
          layers: true
          squash: false
          build-args: |
            IMAGE_FLAVOR=${{ matrix.IMAGE_FLAVOR }}
            IMAGE_VARIANT=unstable-${{ matrix.IMAGE_FLAVOR }}
          oci: true

      - name: Build split image
        id: build_split
        uses: redhat-actions/buildah-build@v3.1.0
        env:
          MODULE_KEY: ${{ secrets.MODULE_KEY }}
          MODULE_CERT: ${{ secrets.MODULE_CERT }}
          SECUREBOOT_CERT: ${{ secrets.SECUREBOOT_CERT }}
        with:
          containerfiles: ${{ matrix.containerfile }}
          extra-args: |
            --target split-kernel
            --secret id=secureboot_cert,env=SECUREBOOT_CERT
            --secret id=module_key,env=MODULE_KEY
            --secret id=module_cert,env=MODULE_CERT
            --security-opt=label=disable
          image: stage-split
          tags: ${{ github.run_id }}
          layers: true
          squash: false
          build-args: |
            IMAGE_FLAVOR=${{ matrix.IMAGE_FLAVOR }}
            IMAGE_VARIANT=unstable-${{ matrix.IMAGE_FLAVOR }}
          oci: true

      - name: Build rechunked image
        id: build_chunk
        uses: redhat-actions/buildah-build@v3.1.0
        env:
          MODULE_KEY: ${{ secrets.MODULE_KEY }}
          MODULE_CERT: ${{ secrets.MODULE_CERT }}
          SECUREBOOT_CERT: ${{ secrets.SECUREBOOT_CERT }}
        with:
          containerfiles: ${{ matrix.containerfile }}
          extra-args: |
            --target chunkah
            --secret id=secureboot_cert,env=SECUREBOOT_CERT
            --secret id=module_key,env=MODULE_KEY
            --secret id=module_cert,env=MODULE_CERT
            --volume ${{ github.workspace }}:/src
            --security-opt=label=disable
          image: stage-chunked
          tags: ${{ github.run_id }}
          layers: true
          build-args: |
            IMAGE_FLAVOR=${{ matrix.IMAGE_FLAVOR }}
            IMAGE_VARIANT=unstable-${{ matrix.IMAGE_FLAVOR }}
          oci: true

      - name: Build final image
        id: build_image
        uses: redhat-actions/buildah-build@v3.1.0
        env:
          SECUREBOOT_KEY: ${{ secrets.SECUREBOOT_KEY }}
          SECUREBOOT_CERT: ${{ secrets.SECUREBOOT_CERT }}
          MODULE_KEY: ${{ secrets.MODULE_KEY }}
          MODULE_CERT: ${{ secrets.MODULE_CERT }}
        with:
          containerfiles: build_files/addons/Containerfile.ukify
          extra-args: |
            --secret id=secureboot_key,env=SECUREBOOT_KEY
            --secret id=secureboot_cert,env=SECUREBOOT_CERT
            --security-opt=label=disable
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.prep.outputs.tags }}
          labels: ${{ steps.prep.outputs.labels }}
          layers: true
          squash: false
          build-args: |
            BASE_IMAGE=${{ steps.build_base.outputs.image-with-tag }}
            SPLITKERNEL_IMAGE=${{ steps.build_split.outputs.image-with-tag }}
          oci: true

      - name: Publish build
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: ./.github/actions/publish-image
        with:
          tags: ${{ steps.prep.outputs.tags }}
          cosign-key: ${{ secrets.SIGNING_SECRET }}

  build_push_nonsealed:
    name: Build Tartaria (nonsealed) (unstable-${{ matrix.IMAGE_FLAVOR }})
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - IMAGE_FLAVOR: arch-berbere
            containerfile: ./build_files/images/Containerfile.arch-nonsealed
          - IMAGE_FLAVOR: arch-amchoor
            containerfile: ./build_files/images/Containerfile.arch-nonsealed
          - IMAGE_FLAVOR: cachy-berbere
            containerfile: ./build_files/images/Containerfile.cachy-nonsealed
          - IMAGE_FLAVOR: cachy-amchoor
            containerfile: ./build_files/images/Containerfile.cachy-nonsealed

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Prepare build
        id: prep
        uses: ./.github/actions/prepare-image
        with:
          image-flavor: ${{ matrix.IMAGE_FLAVOR }}
          default-tag: ${{ env.DEFAULT_TAG }}

      - name: Build image
        id: build_image
        uses: redhat-actions/buildah-build@v3.1.0
        with:
          containerfiles: ${{ matrix.containerfile }}
          extra-args: |
            --volume ${{ github.workspace }}:/src
            --security-opt=label=disable
            --skip-unused-stages=false
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.prep.outputs.tags }}
          labels: ${{ steps.prep.outputs.labels }}
          layers: true
          squash: false
          build-args: |
            IMAGE_FLAVOR=${{ matrix.IMAGE_FLAVOR }}
            IMAGE_VARIANT=stable-${{ matrix.IMAGE_FLAVOR }}
          oci: true

      - name: Publish build
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: ./.github/actions/publish-image
        with:
          tags: ${{ steps.prep.outputs.tags }}
          cosign-key: ${{ secrets.SIGNING_SECRET }}
