# noctalia-greeter sync.toml (UI + Sync; not managed by Nix)
# [session] last, [session.power] suspend/reboot/shutdown, [[session.actions]] action/command/label/glyph
# [appearance] scheme, theme_mode, corner_radius_scale, font_family
# [appearance.palette] full color role table, [appearance.wallpaper]/[appearance.wallpapers.<connector>]
# [output] layout/transforms/scales

[appearance]
corner_radius_scale = 0.69999998807907104
font_family = "Overpass ExtraBold"
scheme = "Synced"
theme_mode = "dark"

    [appearance.palette]
    error = "#FFB4AB"
    hover = "#B5CEA4"
    on_error = "#690005"
    on_hover = "#213618"
    on_primary = "#432C00"
    on_secondary = "#3D2E16"
    on_surface = "#ECE1D4"
    on_surface_variant = "#D2C5B4"
    on_tertiary = "#213618"
    outline = "#4E4539"
    primary = "#F0BF6D"
    secondary = "#DBC3A1"
    shadow = "#000000"
    surface = "#17130B"
    surface_variant = "#241F17"
    tertiary = "#B5CEA4"

    [appearance.wallpaper]
    blur = 0.2
    fill_mode = "crop"
    path = "/usr/share/tartaria/wallpapers/cherry_tree.png"
    tint = 0.3

[session]
last = "Niri"

    [[session.actions]]
    action = "lock"

    [[session.actions]]
    action = "lock_and_suspend"
    glyph = "lock-bolt"

    [[session.actions]]
    action = "suspend"

    [[session.actions]]
    action = "logout"

    [[session.actions]]
    action = "reboot"

    [[session.actions]]
    action = "shutdown"
